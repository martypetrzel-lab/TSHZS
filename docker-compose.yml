services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tshzs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tshzs_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tshzs"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tshzs_postgres:
